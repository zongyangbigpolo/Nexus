- description: Test routing for a task to decompose an epic into stories
  vars:    
    request: Decompose epic SPA-999 into implementable stories and create them in JIRA
    jira: SPA-999
  assert:
    - type: llm-rubric
      value: |
        Evaluate whether the router agent correctly handled the request "Decompose epic SPA-999 into implementable stories and create them in JIRA".

        Score 1.0 if ALL of the following are true:
        - Provides a confidence level
        - Correctly identifies this as a feature implementation or task decomposition request
        - Routes to `dev-coordinator` agent or /feature-planner command
        - Acknowledges or references the JIRA ID SPA-999 explicitly
        - Recognizes the intent to decompose the epic and create child stories
        - Does NOT attempt to decompose the epic or create stories itself — it only routes
      threshold: 1

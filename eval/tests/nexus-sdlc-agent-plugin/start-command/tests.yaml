- description: Test routing through a bugfix prompt using a JIRA bugfix
  vars:    
    request: Implement JIRA bug SPA-1234
    jira: SPA-1234
  assert:
    - type: llm-rubric
      value: |
        Evaluate whether the router agent correctly handled the request "Implement JIRA bug SPA-1234".

        Score 1.0 if ALL of the following are true:
        - Provides a confidence level
        - Correctly identifies this as a bug report, not a story
        - Routes to /bugfix command
        - Does NOT attempt to fix the bug itself — it only routes
      threshold: 1      
      
- description: Test routing for a JIRA feature implementation request
  vars:    
    request: Implement JIRA story SPA-9876
    jira: SPA-9876 
  assert:
    - type: llm-rubric
      value: |
        Evaluate whether the router agent correctly handled the request "Implement feature SPA-9876".

        Score 1.0 if ALL of the following are true:
        - Provides a confidence level as a percentage
        - Correctly identifies this as a feature implementation request
        - Acknowledges or references the JIRA ID SPA-9876 explicitly     
        - Does NOT attempt to implement the feature itself — it only routes
      threshold: 1

- description: Test routing through a bugfix prompt but passing a JIRA story
  vars:    
    request: Implement JIRA bug SPA-9876
    jira: SPA-9876 
  assert:
    - type: llm-rubric
      value: |
        Evaluate whether the router agent correctly handled the request "Implement JIRA bug SPA-9876".

        Score 1.0 if ALL of the following are true:
        - Provides a confidence level
        - Correctly identifies this as a bug report or a story (both are valid interpretations)
        - Routes to dev-coordinator or /task command (feature implementation)
        - Does NOT attempt to fix the bug itself — it only routes
      threshold: 1        

- description: Test routing for an Azure cost analysis request
  vars:    
    request: |
      Review the Azure costs for the current calendar month
      Subscription ID is 1234-5678-9101
      Produce a high-level summary report
      You have read-only Cost Management access
  assert:
    - type: llm-rubric
      value: |
        Evaluate whether the router agent correctly handled the request "Review the Azure costs for this month".

        Score 1.0 if ALL of the following are true:
        - Correctly identifies this as an Azure cost analysis request
        - Routes to /azure-costs
        - Does NOT attempt to perform the analysis itself — it only routes
      threshold: 1
      

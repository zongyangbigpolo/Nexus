- description: Test starting a development task for a JIRA issue
  vars:    
    __userPrompt: "Start development task for jira={{jira}}"
    jira: APP-9876
  assert:
    - type: llm-rubric
      value: |
        Did the agent successfully act as a dev-coordinator agent

        Score 1.0 if:
        - Acts as a dev coordinator agent         
        - Makes an attempt to fetch the JIRA issue APP-9876 OR offer to fetch if the user confirms
        - Plans to create a feature branch starting with: "feature/APP-9876"
        - Plans to create a structured task file for the developer with path starting with: ".github/tasks/APP-9876"
        - Plans for next steps        
      threshold: 1
